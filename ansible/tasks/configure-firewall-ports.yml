---
- name: Allow SSH port
  community.general.ufw:
    rule: allow
    port: "{{ hostvars[inventory_hostname].ansible_port }}"
    proto: tcp

- name: Allow public access port
  community.general.ufw:
    rule: allow
    port: "{{ hostvars[inventory_hostname].access_port }}"
    proto: any

- name: Allow outgoing 443
  community.general.ufw:
    rule: allow
    direction: out
    port: "443"
    proto: any

- name: Allow outgoing 80
  community.general.ufw:
    rule: allow
    direction: out
    port: "80"
    proto: any

- name: Allow incoming 80
  community.general.ufw:
    rule: allow
    port: "80"
    proto: any
