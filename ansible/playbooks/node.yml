---
- name: Install 3x-ui Node and TLS certificate
  hosts: nodes
  remote_user: deployer
  gather_facts: false
  become: true

  tasks:
    - name: Install pexpect
      ansible.builtin.pip:
        name: pexpect
        state: present

    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Check if dotenvx is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/dotenvx.sh
      register: dotenvx_binary

    - name: Download dotenvx script
      ansible.builtin.get_url:
        url: https://dotenvx.sh
        dest: /usr/local/bin/dotenvx.sh
        mode: "0755"
      when: not dotenvx_binary.stat.exists

    - name: Install dotenvx
      ansible.builtin.command: dotenvx.sh
      changed_when: true

    - name: Check if 3x-ui is already installed
      ansible.builtin.stat:
        path: /usr/bin/install_3x_ui.sh
      register: x_ui_binary

    - name: Download 3x-ui installer script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/MHSanaei/3x-ui/main/install.sh
        dest: /usr/bin/install_3x_ui.sh
        mode: "0755"
      when: not x_ui_binary.stat.exists

    - name: Install 3x-ui
      ansible.builtin.command: install_3x_ui.sh
      environment:
        DEBIAN_FRONTEND: noninteractive
        XUI_NONINTERACTIVE: "1"
        XUI_PANEL_PORT: "{{ access_port }}"
        XUI_SSL_MODE: "none"
      changed_when: true

    - name: Ensure 3x-ui service is running
      ansible.builtin.systemd:
        name: x-ui
        state: started
        enabled: true
      changed_when: true

    - name: Install tls certificate
      ansible.builtin.expect:
        command: x-ui
        timeout: 60
        responses:
          "selection": "20\n"
          "Choose an option": "6\n"
          "proceed": "y\n"
          "correct incoming public": "y\n"
          "IPv6": "\n"
          "port": "80\n"
          "an option": "0\n"
        echo: true
      environment:
        NO_COLOR: "1"
      when: molecule_ephemeral_directory is not defined

    - name: Read .env file
      ansible.builtin.slurp:
        src: /etc/x-ui/install-result.env
      register: remote_env
      no_log: true

    - name: Add data to node_credentials
      ansible.builtin.set_fact:
        node_credentials: "{{ json_raw | from_yaml }}"
      vars:
        json_raw: >-
          {% set ns = namespace(res={}) %}
          {% for line in (remote_env.content | b64decode).splitlines() %}
            {% set trimmed = line | trim %}
            {% if trimmed and not trimmed.startswith('#') and '=' in trimmed %}
              {% set parts = trimmed.split('=', 1) %}
              {% set ns.res = ns.res | combine({parts[0] | trim: parts[1] | trim}) %}
            {% endif %}
          {% endfor %}
          {{-
            ns.res
            | combine({
              'NODE_ADDRESS': ansible_host,
              'NODE_LOCATION': location
            })
            | to_json -}}
      no_log: true
