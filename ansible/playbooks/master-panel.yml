---
- name: Install 3x-ui panel and TLS certificate
  hosts: panels
  remote_user: deployer
  gather_facts: false
  become: true

  vars:
    allowed_keys:
      - XUI_SUB_URL
      - XUI_PANEL_PORT
      - XUI_ACCESS_URL
      - XUI_API_TOKEN
      - XUI_USERNAME
      - XUI_PASSWORD

    local_secrets_file: "{{ playbook_dir }}/../../.env"

  vars_prompt:
    - name: xui_username
      prompt: "Panel administrator username"

    - name: xui_password
      prompt: "Panel administrator password"
      private: true

  tasks:
    - name: Install pexpect
      ansible.builtin.pip:
        name: pexpect
        state: present

    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Check if dotenvx is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/dotenvx.sh
      register: dotenvx_binary

    - name: Download dotenvx script
      ansible.builtin.get_url:
        url: https://dotenvx.sh
        dest: /usr/local/bin/dotenvx.sh
        mode: "0755"
      when: not dotenvx_binary.stat.exists

    - name: Install dotenvx
      ansible.builtin.command: dotenvx.sh
      changed_when: true

    - name: Check if 3x-ui is already installed
      ansible.builtin.stat:
        path: /usr/bin/install_3x_ui.sh
      register: x_ui_binary

    - name: Download 3x-ui installer script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/MHSanaei/3x-ui/main/install.sh
        dest: /usr/bin/install_3x_ui.sh
        mode: "0755"
      when: not x_ui_binary.stat.exists

    - name: Install 3x-ui
      ansible.builtin.command: install_3x_ui.sh
      environment:
        DEBIAN_FRONTEND: noninteractive
        XUI_NONINTERACTIVE: "1"
        XUI_PANEL_PORT: "{{ access_port }}"
        XUI_USERNAME: "{{ xui_username }}"
        XUI_PASSWORD: "{{ xui_password }}"
        XUI_SSL_MODE: "none"
      changed_when: true
      when: molecule_ephemeral_directory is not defined

    - name: Install 3x-ui (molecule)
      ansible.builtin.command: install_3x_ui.sh
      environment:
        DEBIAN_FRONTEND: noninteractive
        XUI_NONINTERACTIVE: "1"
        XUI_PANEL_PORT: "{{ access_port }}"
        XUI_USERNAME: "{{ xui_username }}"
        XUI_PASSWORD: "{{ xui_password }}"
        XUI_WEB_BASE_PATH: "{{ xui_web_base_path }}"
        XUI_SSL_MODE: "none"
      changed_when: true
      when: molecule_ephemeral_directory is defined

    - name: Ensure 3x-ui service is running
      ansible.builtin.systemd:
        name: x-ui
        state: started
        enabled: true

    - name: Install tls certificate
      ansible.builtin.expect:
        command: x-ui
        timeout: 60
        responses:
          "selection": "20\n"
          "Choose an option": "6\n"
          "proceed": "y\n"
          "IPv4": "y\n"
          "IPv6": "\n"
          "port": "80\n"
          "an option": "0\n"
        echo: true
      environment:
        NO_COLOR: "1"
      when: molecule_ephemeral_directory is not defined

    - name: Check if .env exist
      ansible.builtin.stat:
        path: "{{ local_secrets_file }}"
      register: file_stat
      delegate_to: localhost

    - name: Read remote 3x-ui credentials
      ansible.builtin.slurp:
        src: /etc/x-ui/install-result.env
      register: remote_env
      no_log: true

    - name: Split up credentials into lines
      ansible.builtin.set_fact:
        remote_lines: "{{ remote_env['content'] | b64decode | split('\n') }}"
      no_log: true

    - name: Parse remote 3x-ui credentials into dictionary
      ansible.builtin.set_fact:
        x_ui_creds: "{{ x_ui_creds | default({}) | combine({(item.split('=', 1)[0] | trim): (item.split('=', 1)[1] | trim)}) }}"
      loop: "{{ remote_lines }}"
      when:
        - "'=' in item"
        - "item.split('=', 1)[0] | trim in allowed_keys"
        - "item | trim != ''"
      no_log: true

    - name: Update or insert 3x-ui secrets in local .env using dotenvx
      ansible.builtin.command:
        cmd: 'dotenvx set {{ item.key }} "{{ item.value }}" -f {{ local_secrets_file }}'
      loop: "{{ x_ui_creds | dict2items }}"
      environment:
        DOTENV_PRIVATE_KEY: "{{ lookup('env', 'DOTENV_PRIVATE_KEY') }}"
      delegate_to: localhost
      changed_when: true
      no_log: true
