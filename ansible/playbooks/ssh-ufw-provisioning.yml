---
- name: Create deployer user and UFW from Host
  hosts: all
  gather_facts: true
  remote_user: root

  tasks:
    - name: Wait for SSH port to become responsive
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Remove password for user
      when: molecule_ephemeral_directory is defined
      block:
        - name: Create deployer user
          ansible.builtin.user:
            name: deployer
            shell: /bin/bash
            state: present
            groups: sudo
            append: true

        - name: Remove password requirement for deployer user account
          ansible.builtin.command:
            cmd: "passwd -d deployer"
          changed_when: true

        - name: Allow deployer user to use sudo without a password
          ansible.builtin.copy:
            content: "deployer ALL=(ALL) NOPASSWD:ALL"
            dest: /etc/sudoers.d/deployer
            mode: "0440"
            validate: "visudo -cf %s"

    - name: Set up ssh and ufw
      when: molecule_ephemeral_directory is not defined
      block:
        - name: Create deployer user
          ansible.builtin.user:
            name: deployer
            shell: /bin/bash
            state: present
            generate_ssh_key: true
            ssh_key_type: ed25519
            ssh_key_comment: "deployer@gmail.com"
            ssh_key_file: ".ssh/deployer"
            groups: sudo
            append: true

        - name: Disable password authentication
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?PasswordAuthentication"
            line: "PasswordAuthentication no"
            state: present
          notify: Restart SSH

        - name: Enable public key authentication
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?PubkeyAuthentication"
            line: "PubkeyAuthentication yes"
            state: present
          notify: Restart SSH

        - name: Disable keyboard-interactive (pam/password challenge) authentication
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?KbdInteractiveAuthentication"
            line: "KbdInteractiveAuthentication no"
            state: present
          notify: Restart SSH

        - name: Copy public key to local machine
          ansible.builtin.fetch:
            src: "/home/deployer/.ssh/id_ed25519.pub"
            dest: ~/.ssh/
            flat: true

        - name: Configure UFW
          ansible.builtin.include_tasks: "../tasks/configure-firewall-ports.yml"

        - name: Enable UFW and set default deny
          community.general.ufw:
            state: enabled
            policy: deny
            direction: in

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
        validate: "sshd -t %s"
