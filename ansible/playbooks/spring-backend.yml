---
- name: Deploy Spring Backend
  hosts: spring_backends
  remote_user: root
  gather_facts: true
  become: true

  vars:
    local_project_root: "{{ playbook_dir }}/../.."
    remote_project_root: "/opt/travelervpn"

  tasks:
    - name: Full docker install
      when: molecule_ephemeral_directory is not defined
      block:
        - name: Install Docker Script
          ansible.builtin.get_url:
            url: https://get.docker.com/
            dest: /usr/bin/docker_install.sh
            mode: "0755"

        - name: Install Docker
          ansible.builtin.command: docker_install.sh
          changed_when: true

        - name: Ensure Docker service is running and enabled
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

    - name: Install docker cli
      when: molecule_ephemeral_directory is defined
      block:
        - name: Create keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0444"

        - name: Add Docker repository to apt
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
            state: present
            update_cache: true

        - name: Install docker cli
          ansible.builtin.apt:
            name: docker-ce-cli
            state: present
            update_cache: true

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ remote_project_root }}"
        state: directory
        mode: "0755"
        owner: 100
        group: 1000

    - name: Copy docker directory
      ansible.builtin.copy:
        src: "{{ local_project_root }}/docker/"
        dest: "{{ remote_project_root }}/docker"
        mode: "0740"
        directory_mode: "0750"
        owner: 100
        group: 1000

    - name: Copy .env
      ansible.builtin.copy:
        src: "{{ local_project_root }}/.env"
        dest: "{{ remote_project_root }}"
        mode: "440"
        owner: 100
        group: 1000
      no_log: true

    - name: Copy main compose
      ansible.builtin.copy:
        src: "{{ local_project_root }}/compose.yaml"
        dest: "{{ remote_project_root }}"
        mode: "440"
        owner: 100
        group: 1000
      no_log: true

    - name: Copy prod compose
      ansible.builtin.copy:
        src: "{{ local_project_root }}/compose.prod.yaml"
        dest: "{{ remote_project_root }}"
        mode: "440"
        owner: 100
        group: 1000
      no_log: true

    - name: Deploy docker-compose project
      community.docker.docker_compose_v2:
        project_src: "{{ remote_project_root }}"
        files:
          - compose.yaml
          - compose.prod.yaml
        state: present
