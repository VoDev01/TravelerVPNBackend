services:
  cassandra:
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_PASSWORD_SEEDER: "yes"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vpn_network
    secrets:
      - app_secrets

  vpn-backend:
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: docker/backend/prod/Dockerfile
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vpn_network
  
  vault:
    ports:
      - "127.0.0.1:8200:8200"
    command: [
      "/bin/sh",
      "-c",
      "init.sh & exec vault server -config=/vault/config/config.hcl"
    ]
    networks:
      - vpn_network

  vault-agent:
    networks:
      - vpn_network

networks:
  vpn_network:
    driver: bridge