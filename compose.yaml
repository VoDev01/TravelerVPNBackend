services:
  cassandra:
    image: cassandra:5.0
    environment:
      - CASSANDRA_CLUSTER_NAME=VpnCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./docker/cassandra/init.sh:/usr/local/bin/init.sh
    command: ["/bin/sh", "-c", "init.sh & docker-entrypoint.sh cassandra -f"]
    healthcheck:
      test: [ "CMD", "cqlsh", "-e", "describe keyspaces" ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: on-failure

  vpn-backend:
    image: traveler_vpn:latest
    environment:
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra:9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=traveler_vpn
      - SPRING_CASSANDRA_SCHEMA_ACTION=create_if_not_exists
    depends_on:
      cassandra:
        condition: service_healthy
      vault-agent:
        condition: service_healthy

  vault:
    image: hashicorp/vault:2.0.3
    volumes:
      - vault-data:/vault/data
      - ./docker/vault/config.hcl:/vault/config/config.hcl:ro
      - ./docker/vault/init-vault.sh:/usr/local/bin/init-vault.sh
    secrets:
      - spring-app-policy
    restart: on-failure
    healthcheck:
        test: [ "CMD", "sh", "-c", "vault status" ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

  vault-agent-init:
    image: alpine:latest
    user: "root"
    volumes:
      - vault-shared:/vault/secrets
    command: ["chown", "-R", "100:100", "vault/secrets"]

  vault-agent:
    image: hashicorp/vault:2.0.3
    working_dir: /vault
    volumes:
      - vault-agent-data:/vault/data
      - ./docker/vault/agent-config.hcl:/vault/agent-config.hcl:ro
      - ./docker/vault/init-agent-vault.sh:/usr/local/bin/init.sh
    depends_on:
      vault:
        condition: "service_healthy"
      vault-agent-init:
        condition: "service_completed_successfully"
    command: ["/bin/sh", "-c", "init.sh & 
    vault agent -config=/vault/agent-config.hcl"]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "sh", "-c", "test -s /vault/secrets/vault-token" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

secrets:
  spring-app-policy:
    file: ./docker/vault/spring-app-policy.hcl

volumes:
  vault-shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  cassandra_data:
  vault-data:
  vault-agent-data: