maxmind:
  downloadUrls:
    - "https://git.io/GeoLite2-City.mmdb"
    - "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb"
  dbPath: "./maxmind/GeoLite2-City.mmdb"
  downloadCron: "0 0 3 * * MON"

spring:
  realityPublicKey: ${realityPublicKey}
  realityShortId: ${realityShortId}
  serverIp: ${serverIp}
  maskDomain: ${maskDomain}
  marzbanUsername: ${marzbanUsername}
  marzbanPassword: ${marzbanPassword}
  xuiToken: ${xuiToken}
  xuiUsername: ${xuiUsername}
  xuiPassword: ${xuiPassword}
  xuiAccessUrl: ${xuiAccessUrl}
  xuiSubUrl: ${xuiSubUrl}

  config:
    import: "vault://"

  cassandra:
    username: ${cassandraUser}
    password: ${cassandraPassword}
    schema-action: create_if_not_exists
    keyspace-name: traveler_vpn
    local-datacenter: datacenter1
    contact-points: cassandra:9042

  flyway:
    url: jdbc:cassandra://cassandra:9042/traveler_vpn?localdatacenter=datacenter1
    user: ${cassandraUser}
    password: ${cassandraPassword}
    locations: classpath:cassandra/migration
    driver-class-name: com.ing.data.cassandra.jdbc.CassandraDriver
    baseline-on-migrate: true
    group: true

  cloud:
    vault:
      uri: http://vault:8200
      authentication: TOKEN-FILE
      token-file: file:/vault/sercrets/vault-token
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        default-context: spring
      application-name: "spring"
